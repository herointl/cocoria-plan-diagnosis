<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cocoria | ぴったりプラン診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mauve:#C8A1B9;--mauve-d:#A47C95;--beige:#EBD9E2;--beige-l:#F7F0F4;
  --ink:#4A4A4A;--ink-l:#8C8088;--line:#ECE2E8;--white:#FFFFFF;
  --serif:'Cormorant Garamond',serif;--sans:'Zen Kaku Gothic New',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--beige-l)}
body{font-family:var(--sans);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
.app{max-width:460px;min-height:100dvh;margin:0 auto;background:var(--white);display:flex;flex-direction:column;position:relative;overflow:hidden}
.app::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--beige) 0%,rgba(235,217,226,0) 70%);top:-170px;right:-120px;pointer-events:none}
header{position:relative;padding-block:30px 0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));text-align:center}
.logo{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:.2em;padding-left:.2em;color:var(--ink);line-height:1.2}
.logo img{display:block;width:230px;max-width:100%;height:auto;margin:0 auto}.logo{padding-left:0;line-height:0}
.tagline{font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:.14em;color:var(--ink-l);margin-top:4px}
.progress{display:flex;gap:6px;margin-top:24px}
.progress i{flex:1;height:2px;border-radius:2px;background:var(--line);transition:background .4s}
.progress i.on{background:var(--mauve)}
main{position:relative;flex:1;padding-block:30px 44px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.fade{animation:fade .55s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--serif);font-size:13px;letter-spacing:.24em;color:var(--mauve-d)}
h1{font-size:21px;font-weight:500;line-height:1.65;letter-spacing:.04em;margin:10px 0 6px}
h3{font-size:14px;font-weight:500;letter-spacing:.08em;margin:34px 0 10px}
.lead{font-size:13px;color:var(--ink-l)}

/* intro */
.hero{text-align:center;padding-top:18px}
.hero h1{font-size:23px;margin-top:18px}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px 0 34px}
.badges span{font-size:12px;padding:6px 14px;border-radius:999px;background:var(--beige-l);color:var(--mauve-d);letter-spacing:.06em}
.mini{font-size:12px;color:var(--ink-l);text-align:center;margin-top:14px}

/* options */
.options{display:grid;gap:10px;margin:26px 0 30px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;background:var(--white);border:1px solid var(--line);border-radius:16px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--mauve)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--mauve);display:grid;place-items:center}
.opt.sel{border-color:var(--mauve);background:var(--beige-l)}
.opt.sel .dot::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--mauve)}
.opt small{display:block;font-size:12px;color:var(--ink-l);line-height:1.5;margin-top:2px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:999px;padding:17px 20px;font:inherit;font-size:15px;font-weight:500;letter-spacing:.08em;text-align:center;text-decoration:none;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--mauve-d);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.btn-main{background:var(--ink);color:#fff}
.btn-main:disabled{opacity:.22;cursor:default}
.btn-pink{background:var(--mauve);color:var(--ink);font-weight:700}
.btn-line{background:var(--white);color:var(--ink);border:1px solid var(--ink)}
.btn-ghost{background:none;color:var(--ink-l);font-size:13px;padding:12px}
.stack{display:grid;gap:10px}

/* result */
.card{position:relative;margin:22px 0 14px;padding:30px 22px 26px;border-radius:24px;background:linear-gradient(160deg,var(--beige) 0%,var(--beige-l) 100%);text-align:center}
.card .label{font-family:var(--serif);font-size:12px;letter-spacing:.28em;color:var(--mauve-d)}
.card h2{font-size:24px;font-weight:500;letter-spacing:.06em;margin:8px 0 2px}
.card .plan-sub{font-size:12px;color:var(--ink-l)}
.price{font-family:var(--serif);font-size:48px;font-weight:500;line-height:1.1;margin-top:16px;letter-spacing:.02em}
.price small{font-family:var(--sans);font-size:13px;color:var(--ink-l);margin-left:4px}
.cond{font-size:12px;color:var(--ink-l);margin-top:6px}
.per{display:inline-block;margin-top:14px;font-size:12px;padding:5px 14px;border-radius:999px;background:var(--white);color:var(--ink)}
.msg{font-size:13px;padding:14px 16px;border-radius:14px;background:var(--beige-l);border-left:3px solid var(--mauve);line-height:1.7}
.msg b{color:var(--mauve-d);font-weight:700}

.style{margin-top:30px;padding:22px 20px;border:1px solid var(--line);border-radius:20px}
.style .eyebrow{font-size:12px}
.style h4{font-size:16px;font-weight:500;margin:6px 0 8px}
.style p{font-size:13px;color:var(--ink)}
.style .hint{margin-top:10px;font-size:12px;color:var(--mauve-d)}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}
.row small{display:block;font-size:11px;color:var(--ink-l)}
.row b{font-family:var(--serif);font-size:20px;font-weight:500;white-space:nowrap}
.row.best{color:var(--mauve-d)}
.tag{font-style:normal;margin-left:8px;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--mauve);color:var(--white);vertical-align:2px;white-space:nowrap}
.note{font-size:11px;color:var(--ink-l);margin:16px 0 30px;line-height:1.7}
footer{text-align:center;padding:0 24px 28px;font-family:var(--serif);font-size:11px;letter-spacing:.2em;color:var(--ink-l)}
</style>
</head>

</div>

  bookingUrl:'#',  // 無料体験・予約ページ（STORES）のURL
  lineUrl:   '#',  // LINE公式アカウントの友だち追加URL
  taxLabel:  '税込'
};
const PRICE = {
  payg:   {60:2500, 120:4500},          // 月額0円会員（都度払い）1回あたり
  subs: [
    {id:'s4', name:'月4回プラン', fee:7980,  inc:4},
    {id:'s8', name:'月8回プラン', fee:12980, inc:8}
  ],
  extra:  1800,   // 月額プランの回数超過 1回あたり
  ext120: 1300    // 月額プランで120分にする場合の追加（1回あたり）
};
/* ======================================== */

const Q = [
  {key:'purpose', title:'cocoriaで、どんな時間を過ごしたいですか？', lead:'いちばん近いものを選んでください', options:[
    ['exercise','しっかり身体を動かしたい','人目を気にせずトレーニング'],
    ['stretch','ストレッチで身体をととのえたい','肩こり・腰まわりのケアにも'],
    ['relax','運動のあとに、ゆっくりくつろぎたい','自分だけのごほうび時間'],
    ['mixed','その日の気分で、いろいろ','運動もリラックスも']]},
  {key:'visits', title:'月に何回くらい通いたいですか？', lead:'無理なく続けられるペースで大丈夫です', options:[
    ['1','月1回'],['2','月2回'],['3','月3回'],['4','月4回','週1回くらい'],['6','月6回'],['8','月8回','週2回くらい']]},
  {key:'duration', title:'1回あたり、どのくらい過ごしたいですか？', lead:'過ごし方に合わせてお選びください', options:[
    ['60','60分','運動やストレッチに集中'],
    ['120','120分','運動60分＋ごほうび時間60分']]},
  {key:'contract', title:'月額プランについて、どう思いますか？', lead:'続けやすい方法を一緒に選びましょう', options:[
    ['yes','お得なら月額プランにしたい'],
    ['maybe','どちらがいいか比べたい'],
    ['no','月額なしで、使うときだけ払いたい']]}
];

const STYLE = {
  exercise:{t:'自分のペースで、しっかりトレーニング', p:'完全個室なので、まわりの目を気にせず集中できます。続けるほどお得になる月額プランとの相性がいい過ごし方です。'},
  stretch: {t:'動画を見ながら、ゆっくりストレッチ', p:'店内のテレビでストレッチ動画を流しながら、身体をほぐせます。ひとりなので、自分のペースで丁寧に。'},
  relax:   {t:'動いたあとは、自分だけのごほうび時間', p:'運動のあとはYogiboでくつろぎながら、ご自身の配信アカウントで好きな映画や動画を。誰にも気を使わない時間をどうぞ。'},
  mixed:   {t:'その日の気分で、過ごし方を選ぶ', p:'しっかり動く日も、ストレッチだけの日も、くつろぐ日も。完全個室だから、毎回自由に過ごせます。'}
};

let step = -1, A = {};
const root = document.getElementById('screen');
const yen = n => '¥' + n.toLocaleString('ja-JP');

if (CONFIG.logoUrl) document.getElementById('logo').innerHTML = `<img src="${CONFIG.logoUrl}" alt="cocoria">`;

function progress(){
  document.getElementById('progress').innerHTML =
    [0,1,2,3].map(i => `<i class="${step >= i ? 'on' : ''}"></i>`).join('');
}

function render(){
  progress();
  if (step === -1) return intro();
  if (step === 4)  return result();
  const q = Q[step];
  root.innerHTML = `<div class="fade">
    <div class="eyebrow">QUESTION ${step+1} / 4</div>
    <h1>${q.title}</h1><p class="lead">${q.lead}</p>
    <div class="options">${q.options.map(([v,t,s]) =>
      `<button class="opt ${A[q.key]===v?'sel':''}" data-v="${v}"><span class="dot"></span><span>${t}${s?`<small>${s}</small>`:''}</span></button>`).join('')}
    </div>
    <div class="stack">
      <button class="btn btn-main" id="next" ${A[q.key]?'':'disabled'}>${step===3?'診断結果を見る':'次へ'}</button>
      <button class="btn btn-ghost" id="back">← 戻る</button>
    </div></div>`;
  root.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    A[q.key] = b.dataset.v;
    root.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
    document.getElementById('next').disabled = false;
  });
  document.getElementById('next').onclick = () => { step++; render(); scrollTo(0,0); };
  document.getElementById('back').onclick = () => { step--; render(); scrollTo(0,0); };
}

function intro(){
  root.innerHTML = `<div class="hero fade">
    <div class="eyebrow">PLAN DIAGNOSIS</div>
    <h1>あなたにぴったりの<br>cocoriaの使い方</h1>
    <p class="lead">4つの質問に答えるだけで、<br>通い方に合ったプランと料金がわかります。</p>
    <div class="badges"><span>女性専用</span><span>完全個室</span><span>24時間</span></div>
    <button class="btn btn-main" id="start">診断をはじめる</button>
    <p class="mini">所要時間 約30秒</p></div>`;
  document.getElementById('start').onclick = () => { step = 0; render(); };
}

function calc(){
  const n = +A.visits, d = +A.duration;
  const plans = [
    {id:'payg', name:'月額0円会員', sub:`都度払い・1回${yen(PRICE.payg[d])}`, cost:n*PRICE.payg[d], monthly:false},
    ...PRICE.subs.map(s => ({
      id:s.id, name:s.name, sub:`月額${yen(s.fee)}・${s.inc}回込み`, monthly:true,
      cost: s.fee + Math.max(0, n - s.inc)*PRICE.extra + (d === 120 ? n*PRICE.ext120 : 0)
    }))
  ];
  const byCost = arr => [...arr].sort((a,b) => a.cost - b.cost)[0];
  const cheapest = byCost(plans);
  const best = A.contract === 'no' ? plans[0] : cheapest;
  return {n, d, plans, best, cheapest};
}

function message(r){
  const payg = r.plans[0], s4 = r.plans[1];
  if (r.best.monthly){
    const save = payg.cost - r.best.cost;
    return `都度払いと比べて、<b>毎月${yen(save)}お得</b>になります。`;
  }
  if (r.cheapest.monthly){
    return `月額プランにすると、<b>毎月${yen(payg.cost - r.cheapest.cost)}お得</b>になります。<br>続けたくなったら、いつでも切り替えられます。`;
  }
  const gap = s4.cost - payg.cost;
  if (r.n >= 2 && gap < PRICE.payg[r.d]*2){
    return `あと<b>${yen(gap)}</b>で、月4回プランにできます。<br>通うペースが増えたら、月額プランがお得です。`;
  }
  return `まずは月額0円で、気軽にお試しください。<br>通うペースが増えたら、月額プランがお得になります。`;
}

function result(){
  const r = calc(), b = r.best, st = STYLE[A.purpose];
  const per = Math.round(b.cost / r.n);
  const hint120 = (A.purpose === 'relax' || A.purpose === 'mixed') && r.d === 60
    ? '<p class="hint">→ 120分にすると、運動のあとにゆっくりくつろぐ時間も取れます。</p>' : '';
  root.innerHTML = `<div class="fade">
    <div class="eyebrow">YOUR RESULT</div>
    <h1>あなたにぴったりなのは</h1>
    <div class="card">
      <div class="label">RECOMMENDED</div>
      <h2>${b.name}</h2>
      <div class="plan-sub">${b.sub}</div>
      <div class="price">${yen(b.cost)}<small>/月（${CONFIG.taxLabel}）</small></div>
      <div class="cond">月${r.n}回・1回${r.d}分の場合</div>
      <div class="per">1回あたり 約${yen(per)}</div>
    </div>
    <p class="msg">${message(r)}</p>

    <div class="style">
      <div class="eyebrow">YOUR STYLE</div>
      <h4>${st.t}</h4>
      <p>${st.p}</p>${hint120}
    </div>

    <h3>プランの比較</h3>
    ${r.plans.map(p => `<div class="row ${p.id===b.id?'best':''}"><span>${p.name}${p.id===b.id?'<em class="tag">おすすめ</em>':''}<small>${p.sub}</small></span><b>${yen(p.cost)}</b></div>`).join('')}
    <p class="note">※月${r.n}回・1回${r.d}分で利用した場合の月額の目安です。月額プランの回数超過は1回${yen(PRICE.extra)}、120分利用は1回あたり${yen(PRICE.ext120)}を加算しています。ご利用前に入会審査があります。</p>

    <div class="stack">
      <a class="btn btn-pink" href="${CONFIG.bookingUrl}">無料体験を予約する</a>
      <a class="btn btn-line" href="${CONFIG.lineUrl}">LINEで気軽に相談する</a>
      <button class="btn btn-ghost" id="restart">もう一度診断する</button>
    </div></div>`;
  document.getElementById('restart').onclick = () => { step = -1; A = {}; render(); scrollTo(0,0); };
}

render();
</script>
